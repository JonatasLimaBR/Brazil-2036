name: data

on:
  push:
    branches: [main]
    paths:
      - "ingestion/**"
      - ".github/workflows/data.yml"
  pull_request:
    paths:
      - "ingestion/**"
      - ".github/workflows/data.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: data-${{ github.ref }}
  cancel-in-progress: true

jobs:
  data-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ingestion
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra dev
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run python -m pytest -q

  deploy-and-run:
    needs: data-checks
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v2
      - uses: astral-sh/setup-uv@v5

      - name: build and push image
        run: |
          IMAGE="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT }}/br2036/ingestion:${{ github.sha }}"
          gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet
          docker build -t "$IMAGE" ingestion
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: deploy job
        run: |
          gcloud run jobs deploy br2036-ingestion \
            --image "$IMAGE" --region "${{ vars.GCP_REGION }}" \
            --project "${{ vars.GCP_PROJECT }}"

      - name: run job
        run: |
          gcloud run jobs execute br2036-ingestion --wait \
            --region "${{ vars.GCP_REGION }}" --project "${{ vars.GCP_PROJECT }}"

      - name: verify provenance chain
        run: |
          uv run --with google-cloud-bigquery \
            python ingestion/scripts/verify_chain.py --project "${{ vars.GCP_PROJECT }}"
