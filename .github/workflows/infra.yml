name: infra

on:
  push:
    branches: [main]
    paths:
      - "infra/terraform/**"
      - ".github/workflows/infra.yml"
  pull_request:
    paths:
      - "infra/terraform/**"
      - ".github/workflows/infra.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pull-requests: write

concurrency:
  group: infra-${{ github.ref }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - run: terraform fmt -check -recursive

      - run: |
          terraform init \
            -backend-config="bucket=${{ vars.GCP_TF_STATE_BUCKET }}"

      - run: terraform validate

      - name: plan
        id: plan
        run: |
          terraform plan -no-color -detailed-exitcode \
            -var="project_id=${{ vars.GCP_PROJECT }}" \
            -var="region=${{ vars.GCP_REGION }}" \
            -var="github_repo=${{ github.repository }}" \
            -out=tfplan || echo "exitcode=$?" >> "$GITHUB_OUTPUT"

      - name: apply
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: terraform apply -no-color -auto-approve tfplan
