dataset: inss_beneficios_emitidos
version: 1

source:
  catalog_url: "https://dados.gov.br/dados/conjuntos-dados/inss-beneficios-emitidos"
  resource_url_pattern: "https://dadosabertos.inss.gov.br/api/3/action/package_show?id=beneficios-emitidos-plano-de-dados-abertos-jun-2023-a-jun-2025"
  organization: "INSS"
  license: "cc-by"
  update_frequency: "monthly"

format:
  type: csv
  delimiter: ";"
  decimal: ","
  encoding: "utf-8"
  wrapped_in: zip

source_columns:
  - despacho
  - sexo_recebedor
  - clientela
  - tipo_beneficio
  - uf
  - meio_pagamento
  - banco
  - municipio
  - municipio_resid
  - vl_liquido
  - ramo_atividade
  - Dt_Inicio_Validade
  - especie
  - especie_codigo_nome

keys:
  - state_ibge_code
  - especie_codigo
  - reference_date

required_fields:
  state_ibge_code:
    type: STRING
    nullable: false
  especie_codigo:
    type: STRING
    nullable: false
  reference_date:
    type: DATE
    nullable: false
  value:
    type: NUMERIC
    nullable: false
    min: 0
  unit:
    type: STRING
    nullable: false
    allowed:
      - BRL

quality_rules:
  - name: non_negative_value
    expr: "min(value) >= 0"
  - name: provenance_coverage
    description: "every Gold metric row (for this reference_date) has a matching metric_provenance row"
    expr: "count(gold) = count(provenance)"

evolution_policy: additive_only
