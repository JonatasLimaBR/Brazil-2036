dataset: divida_bruta_pib
version: 1

source:
  catalog_url: "https://api.bcb.gov.br/dados/serie/bcdata.sgs.13762/dados"
  resource_name: "Divida Bruta do Governo Geral (% PIB) - Metodologia utilizada a partir de 2008"
  organization: "Banco Central do Brasil (BCB)"
  license: "Dados abertos do governo federal"
  update_frequency: "monthly"

format:
  type: json
  encoding: "utf-8"
  note: >
    BCB SGS series 13762 -- public API, no auth. Confirmed real during
    /design: [{"data": "01/07/2026", "valor": "82.51"}, ...], full history
    (2008+) in one response, no pagination. This is the national gross
    general government debt/GDP ratio, not divida_consolidada (state-level
    PAF debt, a different metric -- DESIGN §0.2). Base input for the
    DebtLab simulator (SPEC-010).

source_columns:
  - reference_period
  - value

keys:
  - state_ibge_code
  - metric_id
  - reference_date

required_fields:
  state_ibge_code:
    type: STRING
    nullable: false
    note: "constant 'BR' sentinel -- no territorial dimension in this source"
  metric_id:
    type: STRING
    nullable: false
    allowed:
      - divida_bruta_pib
  reference_date:
    type: DATE
    nullable: false
  value:
    type: NUMERIC
    nullable: false
    note: "debt/GDP ratio as a percentage, never negative"
  unit:
    type: STRING
    nullable: false
    allowed:
      - pct_pib

quality_rules:
  - name: provenance_coverage
    expr: "count(gold) = count(provenance)"

evolution_policy: additive_only
