dataset: selic_mensal
version: 1

source:
  catalog_url: "https://api.bcb.gov.br/dados/serie/bcdata.sgs.4390/dados"
  resource_name: "Taxa de juros - Selic acumulada no mes"
  organization: "Banco Central do Brasil (BCB)"
  license: "Dados abertos do governo federal"
  update_frequency: "monthly"

format:
  type: json
  encoding: "utf-8"
  note: >
    BCB SGS series 4390 -- monthly-accumulated Selic rate, not series 432
    (the Copom daily target rate, wrong grain for this project's monthly
    series -- MACRO_TWIN_EXPANSION DESIGN 0.1). Confirmed real: 15 real
    months (07/2025-09/2026), values 0.21-1.28. Used by
    GET /v1/simulations/debtlab/suggested-assumptions to derive an
    annualized juros_nominal suggestion.

source_columns:
  - reference_period
  - value

keys:
  - state_ibge_code
  - metric_id
  - reference_date

required_fields:
  state_ibge_code:
    type: STRING
    nullable: false
    note: "constant 'BR' sentinel -- no territorial dimension in this source"
  metric_id:
    type: STRING
    nullable: false
    allowed:
      - selic_mensal
  reference_date:
    type: DATE
    nullable: false
  value:
    type: NUMERIC
    nullable: false
    note: "monthly accumulated interest rate, never negative in practice"
  unit:
    type: STRING
    nullable: false
    allowed:
      - pct

quality_rules:
  - name: provenance_coverage
    expr: "count(gold) = count(provenance)"

evolution_policy: additive_only
