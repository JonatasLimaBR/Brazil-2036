dataset: ipca_mensal
version: 1

source:
  catalog_url: "https://api.bcb.gov.br/dados/serie/bcdata.sgs.433/dados"
  resource_name: "IPCA - Variacao mensal"
  organization: "Banco Central do Brasil (BCB)"
  license: "Dados abertos do governo federal"
  update_frequency: "monthly"

format:
  type: json
  encoding: "utf-8"
  note: >
    BCB SGS series 433 -- same public API/shape as pib_mensal and
    divida_bruta_pib (DEBTLAB_SIMULATOR). Confirmed real during /design:
    15 real months (05/2025-07/2026), values -0.11 to 0.88 -- includes a
    real deflation month (08/2025), unlike the always-positive series
    already ingested.

source_columns:
  - reference_period
  - value

keys:
  - state_ibge_code
  - metric_id
  - reference_date

required_fields:
  state_ibge_code:
    type: STRING
    nullable: false
    note: "constant 'BR' sentinel -- no territorial dimension in this source"
  metric_id:
    type: STRING
    nullable: false
    allowed:
      - ipca_mensal
  reference_date:
    type: DATE
    nullable: false
  value:
    type: NUMERIC
    nullable: false
    note: "monthly inflation rate, legitimately negative in a deflation month (real: 08/2025)"
  unit:
    type: STRING
    nullable: false
    allowed:
      - pct

quality_rules:
  - name: provenance_coverage
    expr: "count(gold) = count(provenance)"

evolution_policy: additive_only
