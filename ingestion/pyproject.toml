[project]
name = "br2036-ingestion"
version = "0.1.0"
description = "BRASIL 2036 walking skeleton ingestion job (SPEC-033)"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32",
    "pyyaml>=6.0",
    "google-cloud-storage>=2.18",
    "google-cloud-bigquery>=3.25",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-requests",
    "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingestion"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/ingestion"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
